name: phaseguard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^8.2.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_animate: ^4.5.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  record: ^7.1.1
  google_mlkit_face_detection: ^0.13.0
  fftea: ^1.0.0

  crypto: ^3.0.0
  share_plus: ^10.0.3
  url_launcher: ^6.3.1
  open_filex: ^4.5.1
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.5.5
  agora_rtc_engine: ^6.6.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^17.2.3
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  image_picker: ^1.2.3
  googleapis_auth: ^2.3.3
  google_sign_in: ^6.2.1
  agora_token_service: ^0.1.2
  flutter_shader_kit: ^0.1.1
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/background/
    - assets/logo.png

    - assets/service_account.json
    - connectcall_assets/
    - connectcall_assets/background/
    - connectcall_assets/icons/
    - connectcall_assets/service_account.json
